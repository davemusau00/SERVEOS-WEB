name: ServOS CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run audit:ui
      - name: Upload UI audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.sha }}
          path: artifacts/ui-audit/**
          retention-days: 14
      - run: npm run docs:check

  browser-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install preview browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Run preview browser suite
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14

  browser-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install production browser prerequisites
        run: npx playwright install --with-deps chromium
      - name: Run production acceptance browser suite
        run: npm run test:browser:production
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-production-${{ github.sha }}
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14
  native-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path native-tests/Cargo.toml
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-domain-${{ github.sha }}
          path: native-tests/target/**/test-results/**
          if-no-files-found: ignore
          retention-days: 14
  cloud-protocol-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run test:cloud:base
      - name: Upload base cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-base-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
  cloud-protocol-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run test:cloud:v2
      - name: Upload expansion cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-v2-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
  desktop-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm run check:desktop
      - run: npm run test:desktop
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
  evidence-summary:
    if: always()
    needs: [frontend, browser-preview, browser-production, native-domain, cloud-protocol-base, cloud-protocol-v2, desktop-shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run ci:evidence
        env:
          SERVOS_RELEASE_PROFILE: CI_PREVIEW_AND_STAGED_V2
          SERVOS_JOB_FRONTEND: ${{ needs.frontend.result }}
          SERVOS_JOB_BROWSER_PREVIEW: ${{ needs.browser-preview.result }}
          SERVOS_JOB_BROWSER_PRODUCTION: ${{ needs.browser-production.result }}
          SERVOS_JOB_NATIVE: ${{ needs.native-domain.result }}
          SERVOS_JOB_CLOUD_BASE: ${{ needs.cloud-protocol-base.result }}
          SERVOS_JOB_CLOUD_V2: ${{ needs.cloud-protocol-v2.result }}
          SERVOS_JOB_DESKTOP: ${{ needs.desktop-shell.result }}
      - uses: actions/upload-artifact@v4
        with:
          name: servos-ci-evidence-${{ github.sha }}
          path: artifacts/servos-ci-evidence.json
          retention-days: 30

  release-candidate:
    if: github.ref == 'refs/heads/main'
    needs: [frontend, browser-preview, browser-production, native-domain, cloud-protocol-base, cloud-protocol-v2, desktop-shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Mark same-commit candidate eligibility
        run: node scripts/write-release-candidate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: servos-release-candidate-${{ github.sha }}
          path: artifacts/servos-release-candidate.json
          retention-days: 30
