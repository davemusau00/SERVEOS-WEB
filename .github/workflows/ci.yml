name: ServOS Web CI
on:
  push:
    branches: [main, reset/vps-platform]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run contracts:check
      - run: npm run build
      - run: npm test
      - run: npm run architecture:check
      - run: npm run audit:ui
      - run: npm run docs:check

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serveos
          POSTGRES_PASSWORD: serveos_ci
          POSTGRES_DB: serveos_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serveos -d serveos_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://serveos:serveos_ci@localhost:5432/serveos_api_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefix apps/api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:api
      - run: npm run test:browser:api
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-postgres-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/api-postgres
            test-results/api-postgres
          if-no-files-found: ignore
          retention-days: 14

  browser-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:production
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-production-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/production
            test-results/production
          if-no-files-found: ignore
          retention-days: 14

  print-bridge:
    name: print-bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path apps/print-bridge/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/servos-printer-transport/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/print-bridge/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path crates/servos-printer-transport/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/print-bridge/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path crates/servos-printer-transport/Cargo.toml --all-targets
      - run: cargo build --locked --release --manifest-path apps/print-bridge/Cargo.toml
      - run: cargo build --locked --release --manifest-path crates/servos-printer-transport/Cargo.toml
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --manifest-path apps/print-bridge/Cargo.toml --features windows-service --bin servos-print-bridge-service -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo build --locked --release --manifest-path apps/print-bridge/Cargo.toml --features windows-service --bin servos-print-bridge-service
